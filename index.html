<!DOCTYPE html>
<html lang="en">
  <head>
    <title>To-Do</title>
    <link rel="stylesheet" type="text/css" href="main.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script
      src="https://kit.fontawesome.com/7d62d43862.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body id="body">
    <div class="wrapper" id="app" v-cloak>
      <div class="header-area">
        <h1>to-do</h1>
        <i
          @click="changeNightMode()"
          :class="['fa-regular', nightMode ? 'fa-sun' : 'fa-moon']"
        ></i>
      </div>
      <form @submit.prevent="addTask">
        <input type="text" v-model="newTask" placeholder="Enter task here" />
        <button type="submit">Add</button>
      </form>
      <div class="sort-area">
        <p class="sort-by">Sort by</p>
        <div class="sort">
          <button class="sort-date" @click="sortByDate">Date</button>
          <button class="sort-done" @click="sortByDone">Done</button>
          <button class="sort-pending" @click="sortByPending">Pending</button>
        </div>
      </div>
      <ul>
        <li v-for="(task, index) in tasks" :key="index">
          <div class="wrapper">
            <div class="info-bar">
              <p class="left date">{{ task[1] }}</p>
              <p class="left date time">{{ task[2] }}</p>
              <p
                @click="changeStatus(index)"
                :class="['right status pending', {done:task[3]=='done'}]"
              >
                {{task[3]}}
              </p>
            </div>
            <div :class="['details', {cut:task[3]=='done'}]">
              {{ task[0] }}
            </div>
          </div>
          <button @click="removeTask(index)">X</button>
        </li>
      </ul>
    </div>

    <script src="https://unpkg.com/vue@3"></script>
    <script src="app.js"></script>
  </body>
</html>
